<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>October 2026 — 5 Area Daily Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;1,400&family=Noto+Sans+Bengali:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F3F0FB; --surface:#FFFFFF; --surface-2:#F7F4FD;
  --ink:#181227; --muted:#6B6483; --line:#E1D9F5; --line-soft:#ECE6FA;
  --a-spoken:#E23A81; --a-digital:#2E6EF2; --a-data:#0FAE84; --a-bank:#7C4DEE; --a-biz:#F0930E;
  --done:#0FAE84; --doing:#F0930E; --todo:#A79CC7;
  --shadow:0 2px 4px rgba(60,30,110,.07), 0 14px 30px -16px rgba(60,30,110,.34);
  --radius:12px;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#150F24; --surface:#1E1733; --surface-2:#251C3D;
    --ink:#F1ECFB; --muted:#A79CC7; --line:#3A2E5C; --line-soft:#2C2249;
    --a-spoken:#FF6FB0; --a-digital:#7EA7FF; --a-data:#4FE0B6; --a-bank:#B79CFF; --a-biz:#FFC15C;
    --done:#4FE0B6; --doing:#FFC15C; --todo:#8B7FB0;
    --shadow:0 2px 4px rgba(0,0,0,.4), 0 14px 30px -16px rgba(0,0,0,.65);
  }
}
:root[data-theme="dark"]{
  --bg:#150F24; --surface:#1E1733; --surface-2:#251C3D;
  --ink:#F1ECFB; --muted:#A79CC7; --line:#3A2E5C; --line-soft:#2C2249;
  --a-spoken:#FF6FB0; --a-digital:#7EA7FF; --a-data:#4FE0B6; --a-bank:#B79CFF; --a-biz:#FFC15C;
  --done:#4FE0B6; --doing:#FFC15C; --todo:#8B7FB0;
  --shadow:0 2px 4px rgba(0,0,0,.4), 0 14px 30px -16px rgba(0,0,0,.65);
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%}
body{
  margin:0;background:var(--bg);color:var(--ink);
  font-family:"IBM Plex Sans","Noto Sans Bengali",system-ui,-apple-system,Segoe UI,sans-serif;
  font-size:15px;line-height:1.5;
}
h1,h2,h3,.num{font-family:"Space Grotesk","IBM Plex Sans",system-ui,sans-serif}
.wrap{max-width:1120px;margin:0 auto;padding:0 16px 72px}

/* ---------- masthead ---------- */
.masthead{
  padding:28px 20px 18px;margin:0 -16px 4px;border-radius:0 0 22px 22px;
  background:
    radial-gradient(120% 160% at 0% 0%, color-mix(in srgb, var(--a-digital) 20%, transparent), transparent 55%),
    radial-gradient(120% 160% at 100% 0%, color-mix(in srgb, var(--a-spoken) 18%, transparent), transparent 55%),
    radial-gradient(140% 160% at 50% 120%, color-mix(in srgb, var(--a-data) 14%, transparent), transparent 60%),
    var(--surface);
  border:1px solid var(--line);
}
@media (min-width:641px){ .masthead{padding-left:26px;padding-right:26px} }
.mast-top{display:flex;flex-wrap:wrap;gap:16px;align-items:flex-end;justify-content:space-between}
h1{margin:0;font-size:clamp(22px,4.2vw,31px);font-weight:600;letter-spacing:-.02em;line-height:1.1}
h1 span{display:block;font-family:"IBM Plex Sans",sans-serif;font-size:13px;font-weight:400;color:var(--muted);letter-spacing:0;margin-top:6px}
.gauge{display:flex;align-items:center;gap:14px}
.gauge .fig{text-align:right}
.gauge .big{font-family:"Space Grotesk",sans-serif;font-size:28px;font-weight:600;line-height:1;letter-spacing:-.02em}
.gauge .sub{font-size:12px;color:var(--muted);margin-top:4px}
.ring{width:58px;height:58px;flex:none;filter:drop-shadow(0 2px 6px color-mix(in srgb, var(--a-digital) 35%, transparent))}
.ring circle{fill:none;stroke-width:7}
.ring .bgc{stroke:var(--line)}
.ring .fgc{stroke:url(#ringGrad);stroke-linecap:round;transition:stroke-dashoffset .6s cubic-bezier(.34,1.56,.64,1)}

.bar{height:8px;border-radius:999px;background:var(--line);overflow:hidden;margin-top:18px;position:relative}
.bar i{display:block;height:100%;border-radius:999px;transition:width .5s cubic-bezier(.34,1.2,.64,1);
  background:linear-gradient(90deg,var(--a-spoken),var(--a-digital),var(--a-data),var(--a-biz));
  background-size:200% 100%;animation:flow 5s linear infinite}
@keyframes flow{to{background-position:-200% 0}}

.areabar{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px}
.achip{display:flex;align-items:center;gap:8px;
  background:color-mix(in srgb, var(--c) 12%, var(--surface));
  border:1px solid color-mix(in srgb, var(--c) 30%, var(--line));
  color:var(--c);border-radius:999px;padding:6px 13px 6px 10px;font-size:12.5px;cursor:pointer;
  transition:transform .15s ease, box-shadow .15s ease}
.achip:hover{transform:translateY(-1px);box-shadow:0 4px 12px -4px color-mix(in srgb, var(--c) 50%, transparent)}
.achip .dot{width:9px;height:9px;border-radius:50%;background:var(--c);flex:none;box-shadow:0 0 0 3px color-mix(in srgb, var(--c) 20%, transparent)}
.achip b{font-weight:600;font-family:"Space Grotesk",sans-serif;color:var(--ink)}
.achip.off{opacity:.4;filter:saturate(.4)}
.achip .mini{width:46px;height:4px;border-radius:999px;background:color-mix(in srgb, var(--c) 18%, var(--line));overflow:hidden}
.achip .mini i{display:block;height:100%;background:var(--c);transition:width .4s ease}

/* ---------- tabs ---------- */
.tabs{display:flex;gap:2px;margin:20px 0 18px;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:3px;width:fit-content;max-width:100%;overflow:auto}
.tabs button{appearance:none;border:0;background:transparent;color:var(--muted);font:inherit;font-size:14px;padding:8px 16px;border-radius:8px;cursor:pointer;white-space:nowrap;transition:background .15s ease,color .15s ease}
.tabs button:hover{color:var(--ink)}
.tabs button[aria-selected="true"]{
  background:linear-gradient(120deg,var(--a-digital),var(--a-bank));color:#fff;font-weight:500;
  box-shadow:0 3px 10px -3px color-mix(in srgb, var(--a-digital) 55%, transparent)}

/* ---------- day strip ---------- */
.daystrip{display:flex;gap:6px;overflow-x:auto;padding:4px 2px 12px;scrollbar-width:thin}
.daybtn{flex:none;width:46px;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:7px 0 6px;cursor:pointer;color:var(--ink);font:inherit;text-align:center;transition:transform .15s ease,box-shadow .15s ease}
.daybtn:hover{transform:translateY(-2px);box-shadow:var(--shadow)}
.daybtn .d{font-family:"Space Grotesk",sans-serif;font-size:15px;font-weight:600;line-height:1}
.daybtn .pips{display:flex;gap:2px;justify-content:center;margin-top:6px}
.daybtn .pips i{width:4px;height:4px;border-radius:50%;background:var(--line)}
.daybtn .pips i.on{background:var(--done)}
.daybtn .pips i.mid{background:var(--doing)}
.daybtn[aria-current="true"]{
  background:linear-gradient(150deg,var(--a-digital),var(--a-bank));border-color:transparent;color:#fff;
  box-shadow:0 4px 14px -4px color-mix(in srgb, var(--a-bank) 55%, transparent);transform:translateY(-2px)}
.daybtn[aria-current="true"] .pips i{background:rgba(255,255,255,.32)}
.daybtn[aria-current="true"] .pips i.on{background:#fff}

.dayhead{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin:8px 0 14px;flex-wrap:wrap}
.dayhead h2{margin:0;font-size:19px;font-weight:600;letter-spacing:-.01em}
.dayhead .meta{font-size:13px;color:var(--muted)}

/* ---------- cards ---------- */
.cards{display:grid;gap:12px}
.card{
  background:linear-gradient(180deg, color-mix(in srgb, var(--c) 6%, var(--surface)), var(--surface) 60%);
  border:1px solid color-mix(in srgb, var(--c) 22%, var(--line));border-left:5px solid var(--c);
  border-radius:var(--radius);box-shadow:var(--shadow);padding:14px 16px;
  transition:transform .18s ease,box-shadow .18s ease}
.card:hover{transform:translateY(-3px);box-shadow:0 4px 8px rgba(60,30,110,.08), 0 20px 34px -18px color-mix(in srgb, var(--c) 45%, transparent)}
.card.is-done{opacity:.72}
.card.is-done:hover{opacity:1}
.card-top{display:flex;gap:12px;align-items:flex-start;justify-content:space-between}
.area-name{color:var(--c);font-size:11.5px;font-weight:600;letter-spacing:.04em;font-family:"Space Grotesk",sans-serif}
.topic{font-family:"Space Grotesk",sans-serif;font-size:17px;font-weight:600;letter-spacing:-.01em;margin-top:3px}
.fieldrow{display:grid;grid-template-columns:96px 1fr;gap:6px 14px;margin-top:12px;font-size:14px;align-items:start}
.fieldrow .k{color:var(--muted);font-size:12.5px;padding-top:3px}
.card-foot{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-top:14px;padding-top:12px;border-top:1px solid var(--line-soft)}
.spacer{flex:1}

/* editable */
[contenteditable]{outline:none;border-radius:6px;padding:3px 6px;margin:-3px -6px;transition:background .12s}
[contenteditable]:hover{background:var(--surface-2)}
[contenteditable]:focus{background:var(--surface-2);box-shadow:inset 0 0 0 1.5px var(--c,var(--ink))}
[contenteditable]:empty::before{content:attr(data-ph);color:var(--muted);opacity:.65}

.status{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);background:var(--surface-2);border-radius:999px;padding:6px 14px 6px 10px;font:inherit;font-size:13px;color:var(--ink);cursor:pointer;transition:transform .12s ease,background .15s ease,color .15s ease,border-color .15s ease}
.status:hover{transform:translateY(-1px)}
.status:active{transform:scale(.96)}
.status .mark{font-size:14px;line-height:1}
.status[data-s="done"]{border-color:transparent;background:var(--done);color:#fff;font-weight:500}
.status[data-s="doing"]{border-color:transparent;background:var(--doing);color:#241300;font-weight:500}
.hrs{display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--muted)}
.hrs input{width:62px;font:inherit;font-family:"Space Grotesk",sans-serif;font-size:14px;color:var(--ink);background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:5px 8px;text-align:right;transition:border-color .15s ease}
.hrs input:focus{outline:none;border-color:var(--a-digital)}
.icon-btn{border:1px solid var(--line);background:var(--surface);color:var(--muted);border-radius:8px;padding:5px 10px;font:inherit;font-size:12.5px;cursor:pointer;transition:transform .12s ease,color .15s ease,border-color .15s ease}
.icon-btn:hover{color:var(--ink);border-color:var(--a-digital);transform:translateY(-1px)}
@keyframes pop{0%{transform:scale(1)}45%{transform:scale(1.18)}100%{transform:scale(1)}}
.pop{animation:pop .32s cubic-bezier(.34,1.56,.64,1)}

/* ---------- table ---------- */
.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:12px}
.toolbar input[type=search],.toolbar select{font:inherit;font-size:13.5px;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:9px;padding:7px 10px;transition:border-color .15s ease}
.toolbar input[type=search]:focus,.toolbar select:focus{outline:none;border-color:var(--a-digital)}
.toolbar input[type=search]{min-width:200px;flex:1}
.tablewrap{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}
table{border-collapse:collapse;width:100%;min-width:900px;font-size:13.5px}
thead th{position:sticky;top:0;background:var(--surface-2);text-align:left;font-family:"Space Grotesk",sans-serif;font-weight:600;font-size:12px;color:var(--muted);padding:11px 10px;border-bottom:2px solid var(--line);z-index:2;white-space:nowrap}
tbody td{border-bottom:1px solid var(--line-soft);padding:9px 10px;vertical-align:top;transition:background .12s ease}
tbody tr:hover td{background:var(--surface-2)}
tbody tr.done td:nth-child(n+3):nth-child(-n+5){color:var(--muted);text-decoration:line-through;text-decoration-thickness:1px}
td.c-day{font-family:"Space Grotesk",sans-serif;font-weight:600;width:44px}
td.c-area{width:130px}
td.c-area .tag{display:inline-flex;align-items:center;gap:6px;color:var(--c);font-size:12px;font-weight:600;
  background:color-mix(in srgb, var(--c) 12%, transparent);padding:3px 9px 3px 7px;border-radius:999px}
td.c-area .tag::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--c);flex:none}
td.c-h{width:78px}
td.c-h input{width:56px;font:inherit;font-family:"Space Grotesk",sans-serif;text-align:right;background:transparent;border:1px solid transparent;border-radius:6px;padding:3px 6px;color:var(--ink)}
td.c-h input:hover{background:var(--surface-2)}
td.c-h input:focus{outline:none;background:var(--surface-2);border-color:var(--line)}
td.c-s{width:56px;text-align:center}
.tick{border:0;background:transparent;font-size:19px;line-height:1;cursor:pointer;padding:3px 5px;color:var(--todo);border-radius:7px;transition:transform .12s ease,background .12s ease}
.tick:hover{background:var(--line-soft);transform:scale(1.1)}
.tick[data-s="done"]{color:var(--done)}
.tick[data-s="doing"]{color:var(--doing)}
td.c-x{width:34px}
.del{border:0;background:transparent;color:var(--muted);cursor:pointer;font-size:15px;line-height:1;padding:2px 5px;border-radius:6px;opacity:0}
tr:hover .del{opacity:1}
.del:hover{color:#D03A3A;background:var(--surface-2)}

/* ---------- plan ---------- */
.plan{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(260px,1fr))}
.pcard{
  background:linear-gradient(180deg, color-mix(in srgb, var(--c) 8%, var(--surface)), var(--surface) 55%);
  border:1px solid color-mix(in srgb, var(--c) 24%, var(--line));border-top:4px solid var(--c);
  border-radius:var(--radius);padding:14px 16px;box-shadow:var(--shadow);
  transition:transform .18s ease,box-shadow .18s ease}
.pcard:hover{transform:translateY(-3px);box-shadow:0 4px 8px rgba(60,30,110,.08), 0 20px 34px -18px color-mix(in srgb, var(--c) 45%, transparent)}
.pcard h3{margin:0;font-size:16px;font-weight:600;color:var(--c);letter-spacing:-.01em}
.pcard .prio{display:inline-block;font-size:11.5px;color:var(--c);background:color-mix(in srgb, var(--c) 14%, transparent);border-radius:999px;padding:3px 10px;margin-top:8px;font-weight:500}
.pcard dl{margin:12px 0 0;display:grid;gap:8px}
.pcard dt{font-size:11.5px;color:var(--muted)}
.pcard dd{margin:2px 0 0;font-size:14px}

/* ---------- footer bar ---------- */
.footer{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-top:26px;padding-top:16px;border-top:1px solid var(--line);font-size:12.5px;color:var(--muted)}
.saved{display:inline-flex;align-items:center;gap:7px}
.saved .led{width:7px;height:7px;border-radius:50%;background:var(--done);transition:background .3s}
.saved.pending .led{background:var(--doing)}
.saved.off .led{background:var(--todo)}
button.link{border:0;background:none;color:var(--muted);font:inherit;font-size:12.5px;text-decoration:underline;text-underline-offset:3px;cursor:pointer;padding:0}
button.link:hover{color:var(--ink)}
.empty{padding:34px 16px;text-align:center;color:var(--muted);background:var(--surface);border:1px dashed var(--line);border-radius:var(--radius)}
.confetto{position:fixed;width:6px;height:9px;border-radius:1px;pointer-events:none;z-index:999;top:0;left:0;
  animation:confetti-burst .85s cubic-bezier(.2,.7,.3,1) forwards}
@keyframes confetti-burst{
  to{ transform:translate(var(--dx),var(--dy)) rotate(var(--r)); opacity:0 }
}
:focus-visible{outline:2px solid var(--a-digital);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
@media (max-width:640px){
  .fieldrow{grid-template-columns:1fr;gap:2px}
  .fieldrow .k{padding-top:8px}
  .gauge .big{font-size:23px}
}
</style>
</head>
<body>
<div class="wrap">

  <header class="masthead">
    <div class="mast-top">
      <h1>October 2026 Tracking<span>Five areas · 30 days · edit anything you see</span></h1>
      <div class="gauge">
        <svg class="ring" viewBox="0 0 40 40" aria-hidden="true">
          <defs><linearGradient id="ringGrad" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0%" stop-color="var(--a-digital)"></stop>
            <stop offset="55%" stop-color="var(--a-data)"></stop>
            <stop offset="100%" stop-color="var(--a-spoken)"></stop>
          </linearGradient></defs>
          <circle class="bgc" cx="20" cy="20" r="16"></circle>
          <circle class="fgc" id="ring" cx="20" cy="20" r="16" transform="rotate(-90 20 20)" stroke-dasharray="100.5" stroke-dashoffset="100.5"></circle>
        </svg>
        <div class="fig">
          <div class="big num" id="pct">0%</div>
          <div class="sub" id="stat">0 of 150 tasks · 0 / 240 h</div>
        </div>
      </div>
    </div>
    <div class="bar"><i id="bar" style="width:0%"></i></div>
    <div class="areabar" id="areabar"></div>
  </header>

  <nav class="tabs" role="tablist">
    <button role="tab" id="tab-day" aria-selected="true">Day view</button>
    <button role="tab" id="tab-month" aria-selected="false">Full month</button>
    <button role="tab" id="tab-plan" aria-selected="false">Monthly plan</button>
  </nav>

  <section id="view-day">
    <div class="daystrip" id="daystrip"></div>
    <div class="dayhead">
      <h2 id="dayTitle">Day 1</h2>
      <div class="meta" id="dayMeta"></div>
    </div>
    <div class="cards" id="cards"></div>
    <div class="footer" style="border:0;padding-top:12px;margin-top:12px">
      <button class="icon-btn" id="addDay">Add a task to this day</button>
    </div>
  </section>

  <section id="view-month" hidden>
    <div class="toolbar">
      <input type="search" id="q" placeholder="Search topic, task or notes">
      <select id="fArea"><option value="">All areas</option></select>
      <select id="fStatus">
        <option value="">Any status</option>
        <option value="todo">Not started</option>
        <option value="doing">In progress</option>
        <option value="done">Done</option>
      </select>
      <button class="icon-btn" id="addRow">Add row</button>
    </div>
    <div class="tablewrap">
      <table>
        <thead><tr>
          <th>Day</th><th>Area</th><th>Topic</th><th>Task</th><th>Expected output</th>
          <th>Hours</th><th>Done</th><th>Notes</th><th></th>
        </tr></thead>
        <tbody id="tbody"></tbody>
      </table>
    </div>
    <p id="noRows" class="empty" hidden>Nothing matches these filters. Clear the search or pick another area.</p>
  </section>

  <section id="view-plan" hidden>
    <div class="plan" id="plan"></div>
    <div class="footer" style="border:0;padding-top:16px;margin-top:8px">
      <button class="icon-btn" id="addPlan">Add an area</button>
    </div>
  </section>

  <div class="footer">
    <span class="saved" id="saved"><i class="led"></i><span id="savedText">Saved</span></span>
    <span class="spacer" style="flex:1"></span>
    <button class="link" id="themeBtn">Switch theme</button>
    <button class="link" id="csvBtn">Download CSV</button>
    <button class="link" id="resetBtn">Reset to the original sheet</button>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

const PALETTE = ["--a-spoken","--a-digital","--a-data","--a-bank","--a-biz"];
const colorOf = a => `var(${AREA_VAR[a] || PALETTE[Math.abs(hash(a||"")) % PALETTE.length]})`;
function hash(s){let h=0;for(let i=0;i<s.length;i++)h=(h*31+s.charCodeAt(i))|0;return h}
const STATUS = {todo:{mark:"☐",label:"Not started"},doing:{mark:"◐",label:"In progress"},done:{mark:"☑",label:"Done"}};
const NEXT = {todo:"doing",doing:"done",done:"todo"};
const esc = s => String(s??"").replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
const $ = s => document.querySelector(s);

/* ---------------- Supabase ---------------- */
const SUPABASE_URL = 'https://pduklihckylyxhkhxvcf.supabase.co';
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InBkdWtsaWhja3lseXhoa2h4dmNmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTEyMTg2OTksImV4cCI6MjEwNjc5NDY5OX0.6Tfm7llAnSz4bcelNbBkE8zpj5rQOGcqSbca3kjgPn4';
const ROW_ID = 'oct-2026';
let sb = null;
try{ sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY); }catch(e){ console.error("Supabase failed to start", e); }

let state = load() || structuredClone(SEED);
normalise(state);
let day = Number(localStorage.getItem("oct26.day")) || 1;
let view = "day";
let filters = {q:"",area:"",status:""};

function normalise(s){
  s.rows = (s.rows||[]).map((r,i)=>({
    id: r.id || ("r"+i+"-"+Math.random().toString(36).slice(2,7)),
    day: Number(r.day)||1, area: r.area||"", topic: r.topic||"", task: r.task||"",
    output: r.output||"", status: r.status in STATUS ? r.status : "todo",
    hours: Number(r.hours)||0, notes: r.notes||""
  }));
  s.plan = (s.plan||[]).map((p,i)=>({id:p.id||("p"+i),area:p.area||"",priority:p.priority||"",focus:p.focus||"",goal:p.goal||""}));
}

/* ---------------- storage ---------------- */
const LS = "oct26.tracker.v1";
function load(){ try{ const raw = localStorage.getItem(LS); return raw ? JSON.parse(raw) : null; }catch(e){ return null } }
let loaded = false, timer = null, dirty = false;
function setSaved(mode,text){ const el=$("#saved"); el.className="saved"+(mode?" "+mode:""); $("#savedText").textContent=text; }

async function pushRemote(){
  if(!sb){ setSaved("off","Saved on this device only"); return; }
  const { error } = await sb.from('tracker').upsert({
    id: ROW_ID,
    data: { rows: state.rows, plan: state.plan },
    updated_at: new Date().toISOString()
  });
  if(error){ console.error(error); setSaved("off","Saved on this device only"); }
  else { dirty = false; setSaved("","Saved"); }
}
function save(){
  dirty = true;
  try{ localStorage.setItem(LS, JSON.stringify(state)); }catch(e){}
  setSaved("pending","Saving…");
  clearTimeout(timer);
  timer = setTimeout(()=>{
    if(!loaded){ timer = setTimeout(()=>save(), 1000); return; }
    pushRemote();
  }, 600);
}
(async function connect(){
  if(!sb){ loaded = true; setSaved("off","Saved on this device only"); return; }
  try{
    const { data, error } = await sb.from('tracker').select('data').eq('id', ROW_ID).maybeSingle();
    if(error) throw error;
    if(data && data.data && Array.isArray(data.data.rows) && data.data.rows.length && !dirty){
      state = { rows: data.data.rows, plan: data.data.plan || state.plan };
      normalise(state);
      try{ localStorage.setItem(LS, JSON.stringify(state)); }catch(e){}
      loaded = true;
      render();
      setSaved("","Saved");
    } else {
      loaded = true;
      await pushRemote();
    }
  }catch(e){
    console.error(e);
    loaded = true;
    setSaved("off","Saved on this device only");
  }
})();

/* ---------------- helpers ---------------- */
const rowById = id => state.rows.find(r=>r.id===id);
const days = () => { const d=[...new Set(state.rows.map(r=>r.day))].sort((a,b)=>a-b); return d.length?d:[1]; };

function editable(id, field, value, ph, cls){
  return `<div class="${cls||""}" contenteditable="plaintext-only" spellcheck="false"
    data-id="${id}" data-f="${field}" data-ph="${esc(ph||"")}">${esc(value)}</div>`;
}

/* ---------------- stats ---------------- */
function stats(){
  const rows = state.rows, done = rows.filter(r=>r.status==="done");
  const hTot = rows.reduce((s,r)=>s+(+r.hours||0),0);
  const hDone = done.reduce((s,r)=>s+(+r.hours||0),0);
  return {n:rows.length, done:done.length, pct: rows.length? Math.round(done.length/rows.length*100):0, hTot, hDone};
}
const fmtH = n => (Math.round(n*10)/10).toString();
function renderStats(){
  const s = stats();
  $("#pct").textContent = s.pct + "%";
  $("#stat").textContent = `${s.done} of ${s.n} tasks · ${fmtH(s.hDone)} / ${fmtH(s.hTot)} h`;
  $("#bar").style.width = s.pct + "%";
  $("#ring").style.strokeDashoffset = (100.5 - 1.005*s.pct).toFixed(1);

  const areas = [...new Set(state.rows.map(r=>r.area))];
  $("#areabar").innerHTML = areas.map(a=>{
    const rs = state.rows.filter(r=>r.area===a), d = rs.filter(r=>r.status==="done").length;
    const p = rs.length? Math.round(d/rs.length*100):0;
    const off = filters.area && filters.area!==a ? " off":"";
    return `<button class="achip${off}" data-area="${esc(a)}" style="--c:${colorOf(a)}">
      <span class="dot"></span><span>${esc(a)}</span>
      <span class="mini"><i style="width:${p}%"></i></span><b>${d}/${rs.length}</b></button>`;
  }).join("");
  const sel = $("#fArea"), cur = sel.value;
  sel.innerHTML = `<option value="">All areas</option>` + areas.map(a=>`<option${a===cur?" selected":""}>${esc(a)}</option>`).join("");
}

/* ---------------- day view ---------------- */
function renderDayStrip(){
  $("#daystrip").innerHTML = days().map(d=>{
    const rs = state.rows.filter(r=>r.day===d);
    const pips = rs.slice(0,5).map(r=>`<i class="${r.status==="done"?"on":r.status==="doing"?"mid":""}"></i>`).join("");
    return `<button class="daybtn" data-day="${d}" aria-current="${d===day}"><span class="d">${d}</span><span class="pips">${pips}</span></button>`;
  }).join("");
  const strip = $("#daystrip");
  const el = strip.querySelector(`.daybtn[data-day="${day}"]`);
  if(el){
    const off = el.getBoundingClientRect().left - strip.getBoundingClientRect().left + strip.scrollLeft;
    strip.scrollLeft = off - (strip.clientWidth - el.offsetWidth) / 2;
  }
}
function renderDay(){
  const rs = state.rows.filter(r=>r.day===day);
  $("#dayTitle").textContent = "Day " + day;
  const d = rs.filter(r=>r.status==="done").length;
  const h = rs.reduce((s,r)=>s+(+r.hours||0),0);
  $("#dayMeta").textContent = `${d} of ${rs.length} done · ${fmtH(h)} h planned`;
  $("#cards").innerHTML = rs.length ? rs.map(r=>`
    <article class="card${r.status==="done"?" is-done":""}" style="--c:${colorOf(r.area)}">
      <div class="card-top">
        <div style="min-width:0;flex:1">
          ${editable(r.id,"area",r.area,"Area","area-name")}
          ${editable(r.id,"topic",r.topic,"Topic","topic")}
        </div>
      </div>
      <div class="fieldrow">
        <div class="k">Task</div>${editable(r.id,"task",r.task,"What will you do?")}
        <div class="k">Expected output</div>${editable(r.id,"output",r.output,"What will exist at the end?")}
        <div class="k">Notes</div>${editable(r.id,"notes",r.notes,"Anything worth remembering")}
      </div>
      <div class="card-foot">
        <button class="status" data-act="cycle" data-id="${r.id}" data-s="${r.status}">
          <span class="mark">${STATUS[r.status].mark}</span>${STATUS[r.status].label}</button>
        <label class="hrs">Hours <input type="number" step="0.5" min="0" value="${r.hours}" data-id="${r.id}" data-f="hours"></label>
        <span class="spacer"></span>
        <button class="icon-btn" data-act="del" data-id="${r.id}">Remove</button>
      </div>
    </article>`).join("")
    : `<div class="empty">No tasks on day ${day} yet. Add one below.</div>`;
}

/* ---------------- month table ---------------- */
function visibleRows(){
  const q = filters.q.toLowerCase();
  return state.rows.filter(r=>{
    if(filters.area && r.area!==filters.area) return false;
    if(filters.status && r.status!==filters.status) return false;
    if(q && !(`${r.topic} ${r.task} ${r.output} ${r.notes} ${r.area}`.toLowerCase().includes(q))) return false;
    return true;
  }).sort((a,b)=>a.day-b.day);
}
function renderTable(){
  const rs = visibleRows();
  $("#noRows").hidden = rs.length>0;
  $("#tbody").innerHTML = rs.map(r=>`
    <tr class="${r.status==="done"?"done":""}">
      <td class="c-day">${editable(r.id,"day",r.day,"")}</td>
      <td class="c-area" style="--c:${colorOf(r.area)}"><span class="tag">${editable(r.id,"area",r.area,"Area")}</span></td>
      <td>${editable(r.id,"topic",r.topic,"Topic")}</td>
      <td>${editable(r.id,"task",r.task,"Task")}</td>
      <td>${editable(r.id,"output",r.output,"Expected output")}</td>
      <td class="c-h"><input type="number" step="0.5" min="0" value="${r.hours}" data-id="${r.id}" data-f="hours"></td>
      <td class="c-s"><button class="tick" data-act="cycle" data-id="${r.id}" data-s="${r.status}"
          title="${STATUS[r.status].label}">${STATUS[r.status].mark}</button></td>
      <td>${editable(r.id,"notes",r.notes,"—")}</td>
      <td class="c-x"><button class="del" data-act="del" data-id="${r.id}" title="Delete row">✕</button></td>
    </tr>`).join("");
}

/* ---------------- plan ---------------- */
function renderPlan(){
  $("#plan").innerHTML = state.plan.map(p=>`
    <div class="pcard" style="--c:${colorOf(p.area)}">
      ${editable(p.id,"area",p.area,"Area","pcard-h")}
      ${editable(p.id,"priority",p.priority,"Priority","prio")}
      <dl>
        <dt>Daily focus</dt><dd>${editable(p.id,"focus",p.focus,"How much time per day")}</dd>
        <dt>October goal</dt><dd>${editable(p.id,"goal",p.goal,"What success looks like")}</dd>
      </dl>
      <div style="margin-top:12px"><button class="icon-btn" data-act="delplan" data-id="${p.id}">Remove</button></div>
    </div>`).join("");
  document.querySelectorAll(".pcard-h").forEach(el=>{
    el.style.cssText="font-family:'Space Grotesk',sans-serif;font-size:16px;font-weight:600;color:var(--c);letter-spacing:-.01em";
  });
}

function render(){
  renderStats(); renderDayStrip();
  if(view==="day") renderDay();
  if(view==="month") renderTable();
  if(view==="plan") renderPlan();
}

/* ---------------- little celebration ---------------- */
function celebrate(x,y,color){
  const colors = [color,"var(--a-spoken)","var(--a-digital)","var(--a-data)","var(--a-bank)","var(--a-biz)"];
  for(let i=0;i<14;i++){
    const el = document.createElement("i");
    el.className = "confetto";
    const ang = Math.random()*Math.PI*2, dist = 40+Math.random()*46;
    el.style.setProperty("--dx", (Math.cos(ang)*dist)+"px");
    el.style.setProperty("--dy", (Math.sin(ang)*dist-18)+"px");
    el.style.setProperty("--r", (Math.random()*360)+"deg");
    el.style.left = x+"px"; el.style.top = y+"px";
    el.style.background = colors[i % colors.length];
    document.body.appendChild(el);
    setTimeout(()=>el.remove(), 900);
  }
}

/* ---------------- events ---------------- */
document.addEventListener("input", e=>{
  const el = e.target;
  const id = el.dataset.id, f = el.dataset.f;
  if(!id || !f) return;
  const rec = rowById(id) || state.plan.find(p=>p.id===id);
  if(!rec) return;
  if(f==="hours") rec.hours = Math.max(0, Number(el.value)||0);
  else if(f==="day") rec.day = Math.max(1, parseInt(el.textContent.replace(/\D/g,""),10)||1);
  else rec[f] = el.textContent.trim();
  if(f==="hours"||f==="day") renderStats();
  save();
});
document.addEventListener("blur", e=>{
  const f = e.target.dataset?.f;
  if(f==="area"||f==="day"){ render(); }
}, true);

document.addEventListener("click", e=>{
  const b = e.target.closest("[data-act], .daybtn, .achip");
  if(!b) return;
  if(b.classList.contains("daybtn")){ day = +b.dataset.day; localStorage.setItem("oct26.day",day); renderDayStrip(); renderDay(); return; }
  if(b.classList.contains("achip")){
    filters.area = filters.area===b.dataset.area ? "" : b.dataset.area;
    $("#fArea").value = filters.area; renderStats(); if(view==="month") renderTable(); return;
  }
  const act = b.dataset.act, id = b.dataset.id;
  if(act==="cycle"){
    const r = rowById(id);
    const becameDone = r.status!=="done" && NEXT[r.status]==="done";
    r.status = NEXT[r.status];
    if(becameDone){
      const rect = b.getBoundingClientRect();
      celebrate(rect.left+rect.width/2, rect.top+rect.height/2, colorOf(r.area));
    }
    save(); render();
  }
  if(act==="del"){
    state.rows = state.rows.filter(r=>r.id!==id); save(); render();
  }
  if(act==="delplan"){
    state.plan = state.plan.filter(p=>p.id!==id); save(); renderPlan(); 
  }
});

$("#addDay").onclick = ()=>{
  const last = state.rows.filter(r=>r.day===day).slice(-1)[0];
  state.rows.push({id:"r"+Date.now(),day,area:last?last.area:"",topic:"",task:"",output:"",status:"todo",hours:1,notes:""});
  save(); render();
  const cards = document.querySelectorAll("#cards .card");
  cards[cards.length-1]?.querySelector(".area-name")?.focus();
};
$("#addRow").onclick = ()=>{
  const d = filters.area ? day : (days().slice(-1)[0]||1);
  state.rows.push({id:"r"+Date.now(),day:d,area:filters.area||"",topic:"",task:"",output:"",status:"todo",hours:1,notes:""});
  save(); render();
  $("#tbody tr:last-child [data-f='topic']")?.focus();
};
$("#addPlan").onclick = ()=>{
  state.plan.push({id:"p"+Date.now(),area:"New area",priority:"Minor",focus:"",goal:""});
  save(); renderPlan();
};

document.querySelectorAll('[role="tab"]').forEach(t=>{
  t.onclick = ()=>{
    view = t.id.replace("tab-","");
    document.querySelectorAll('[role="tab"]').forEach(x=>x.setAttribute("aria-selected", x===t));
    $("#view-day").hidden = view!=="day";
    $("#view-month").hidden = view!=="month";
    $("#view-plan").hidden = view!=="plan";
    render();
  };
});
$("#q").oninput = e=>{ filters.q = e.target.value; renderTable(); };
$("#fArea").onchange = e=>{ filters.area = e.target.value; renderStats(); renderTable(); };
$("#fStatus").onchange = e=>{ filters.status = e.target.value; renderTable(); };

$("#themeBtn").onclick = ()=>{
  const cur = document.documentElement.getAttribute("data-theme");
  const next = cur==="dark" ? "light" : "dark";
  document.documentElement.setAttribute("data-theme", next);
  localStorage.setItem("oct26.theme", next);
};
(function(){ const t = localStorage.getItem("oct26.theme"); if(t) document.documentElement.setAttribute("data-theme", t); })();

$("#resetBtn").onclick = ()=>{
  if(!confirm("This replaces every task, hour and note with the original sheet. Continue?")) return;
  state = structuredClone(SEED); normalise(state); save(); render();
};

function csv(){
  const head = ["Day","Area","Topic","Task","Expected Output","Status","Target Hours","Notes"];
  const q = v => `"${String(v??"").replace(/"/g,'""')}"`;
  const body = [...state.rows].sort((a,b)=>a.day-b.day)
    .map(r=>[r.day,r.area,r.topic,r.task,r.output,STATUS[r.status].label,r.hours,r.notes].map(q).join(","));
  return "\uFEFF" + [head.map(q).join(","), ...body].join("\r\n");
}
$("#csvBtn").onclick = ()=>{
  const blob = new Blob([csv()], {type:"text/csv;charset=utf-8"});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "October_2026_Tracking.csv";
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(a.href), 1000);
};

render();
</script>
</body>
